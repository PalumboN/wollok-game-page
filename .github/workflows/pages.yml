name: Deploy Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install wollok-web-tools
        run: npm install wollok-web-tools

      - name: Copy game runtime
        run: |
          cp node_modules/wollok-web-tools/dist/web/game-index.js ./game-index.js

      - name: Generate paths.txt
        run: |
          find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.github/*' \
            -not -name 'paths.txt' \
            -not -name 'game-index.js' \
            -not -name 'index.html' \
            -not -name 'test.js' \
            | sed 's|^\./||' \
            > paths.txt

      - name: Generate test.js
        run: |
          cat > test.js <<'EOF'
          const parent = document.getElementById('game')

          const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp']
          const soundExtensions = ['.mp3', '.wav', '.ogg']

          const isExtension = (path, extensions) =>
              extensions.some(extension =>
                  path.toLowerCase().endsWith(extension)
              )

          fetch('./paths.txt')
              .then(response => response.text())
              .then(text => text
                  .split('\n')
                  .map(path => path.trim())
                  .filter(path => path !== '')
              )
              .then(paths => {
                  const sourcePaths = paths.filter(path =>
                      path.endsWith('.wlk') || path.endsWith('.wpgm')
                  )

                  const imagePaths = paths.filter(path =>
                      isExtension(path, imageExtensions)
                  )

                  const soundPaths = paths.filter(path =>
                      isExtension(path, soundExtensions)
                  )

                  return Promise.all(
                      sourcePaths.map(path =>
                          fetch(`./${path}`)
                              .then(response => response.text())
                              .then(content => ({
                                  name: path,
                                  content
                              }))
                      )
                  ).then(sources => ({
                      main: 'pepita',
                      sources,
                      images: imagePaths.map(path => ({
                          possiblePaths: [path],
                          url: `./${path}`
                      })),
                      sounds: soundPaths.map(path => ({
                          possiblePaths: [path],
                          url: `./${path}`
                      }))
                  }))
              })
              .then(project => {
                  console.log('Project:', project)
                  new LocalGame(project).start(parent)
              })
          EOF

      - name: Generate index.html
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <link rel="stylesheet" href="game.css" />

              <script>
                var process = {};
              </script>

              <script src="./game-index.js"></script>
            </head>

            <body>
              <main>
                <div id="game" class="game"></div>
              </main>

              <script src="./test.js"></script>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4